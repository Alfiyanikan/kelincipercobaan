        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[-7.8185739931653755,112.0477439873732],[-7.2573078006115415,112.92472172706393]]);
        
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() { popup.update(); });
                            img.addEventListener('error', function() { popup.update(); });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() { popup.setContent(tempDiv.innerHTML); popup.update(); }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px"; video.style.height = "300px";
                    video.style.maxHeight = "60vh"; video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    video.addEventListener('loadedmetadata', function() { popup.update(); });
                    setTimeout(function() { popup.setContent(tempDiv.innerHTML); popup.update(); }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        var zoomControl = L.control.zoom({ position: 'topleft' }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters', secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters', secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';
        
        var bounds_group = new L.featureGroup([]);
        function setBounds() {}

        // --- LAYER 1: BATAS KECAMATAN ---
        function pop_BatasKecamatanKabupatenMojokerto_0(feature, layer) {
            var popupContent = '<table>\
                    <tr><td colspan="2">' + (feature.properties['WADMKC'] !== null ? autolinker.link(String(feature.properties['WADMKC']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                    <tr><th scope="row">KEPADATAN</th><td>' + (feature.properties['KEPADATAN'] !== null ? autolinker.link(String(feature.properties['KEPADATAN']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) { addClassToPopupIfMedia(content, e.popup); });
			layer.bindPopup(content, { maxHeight: 400 });
        }
        function style_BatasKecamatanKabupatenMojokerto_0_0() {
            return { pane: 'pane_BatasKecamatanKabupatenMojokerto_0', opacity: 1, color: 'rgba(35,35,35,1.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(190,207,80,1.0)', interactive: true };
        }
        map.createPane('pane_BatasKecamatanKabupatenMojokerto_0');
        map.getPane('pane_BatasKecamatanKabupatenMojokerto_0').style.zIndex = 400;
        var layer_BatasKecamatanKabupatenMojokerto_0 = new L.geoJson(json_BatasKecamatanKabupatenMojokerto_0, {
            interactive: true, pane: 'pane_BatasKecamatanKabupatenMojokerto_0', onEachFeature: pop_BatasKecamatanKabupatenMojokerto_0, style: style_BatasKecamatanKabupatenMojokerto_0_0,
        });
        bounds_group.addLayer(layer_BatasKecamatanKabupatenMojokerto_0);
        map.addLayer(layer_BatasKecamatanKabupatenMojokerto_0);

        // --- LAYER 2: GOOGLE SATELLITE ---
        map.createPane('pane_GoogleSatelite_1');
        map.getPane('pane_GoogleSatelite_1').style.zIndex = 401;
        var layer_GoogleSatelite_1 = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            pane: 'pane_GoogleSatelite_1', opacity: 1.0, maxZoom: 28, maxNativeZoom: 20
        });
        map.addLayer(layer_GoogleSatelite_1);

        // --- LAYER 3: KEMIRINGAN LERENG ---
        map.createPane('pane_KemiringanLereng_2');
        map.getPane('pane_KemiringanLereng_2').style.zIndex = 402;
        var layer_KemiringanLereng_2 = new L.imageOverlay('data/KemiringanLereng_2.png', [[-7.779177918,112.331908191],[-7.303180318,112.663216322]], {pane: 'pane_KemiringanLereng_2'});
        bounds_group.addLayer(layer_KemiringanLereng_2);
        map.addLayer(layer_KemiringanLereng_2);

        // --- LAYER 4: WEIGHTED OVL ---
        map.createPane('pane_WEIGHTEDOVL_3');
        map.getPane('pane_WEIGHTEDOVL_3').style.zIndex = 403;
        var layer_WEIGHTEDOVL_3 = new L.imageOverlay('data/WEIGHTEDOVL_3.png', [[-7.700873133,112.331875132],[-7.303073133,112.663375132]], {pane: 'pane_WEIGHTEDOVL_3'});
        bounds_group.addLayer(layer_WEIGHTEDOVL_3);
        map.addLayer(layer_WEIGHTEDOVL_3);

        // --- LAYER 5: BUFFER TPA ---
        function pop_BufferTPA_4(feature, layer) {
            var popupContent = '<table><tr><th scope="row">distance</th><td>' + (feature.properties['distance'] !== null ? autolinker.link(String(feature.properties['distance']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr></table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) { addClassToPopupIfMedia(content, e.popup); });
			layer.bindPopup(content, { maxHeight: 400 });
        }
        function style_BufferTPA_4_0(feature) {
            switch(String(feature.properties['OBJECTID'])) {
                case '1': return { pane: 'pane_BufferTPA_4', opacity: 1, color: 'rgba(35,35,35,1.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(235,6,6,1.0)', interactive: true };
                case '2': return { pane: 'pane_BufferTPA_4', opacity: 1, color: 'rgba(35,35,35,1.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(246,236,62,1.0)', interactive: true };
                case '3': return { pane: 'pane_BufferTPA_4', opacity: 1, color: 'rgba(35,35,35,1.0)', weight: 1.0, fill: true, fillOpacity: 1, fillColor: 'rgba(231,153,112,1.0)', interactive: true };
            }
        }
        map.createPane('pane_BufferTPA_4');
        map.getPane('pane_BufferTPA_4').style.zIndex = 404;
        var layer_BufferTPA_4 = new L.geoJson(json_BufferTPA_4, {
            interactive: true, pane: 'pane_BufferTPA_4', onEachFeature: pop_BufferTPA_4, style: style_BufferTPA_4_0,
        });
        bounds_group.addLayer(layer_BufferTPA_4);
        map.addLayer(layer_BufferTPA_4);

        // --- LAYER 6: TPA MOJOKERTO ---
        function pop_TPAMOJOKERTO_5(feature, layer) {
            var popupContent = '<table>\
                    <tr><td colspan="2">' + (feature.properties['Edit Widge'] !== null ? autolinker.link(String(feature.properties['Edit Widge']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                    <tr><td colspan="2">' + (feature.properties['OBJEK'] !== null ? autolinker.link(String(feature.properties['OBJEK']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                    <tr><td colspan="2"><strong>photo</strong><br />' + (feature.properties['gambar'] !== null ? '<img src="images/' + String(feature.properties['gambar']).replace(/[\\/:]/g, '_').trim().replace(/'/g, '\'').replace(/"/g, '&quot;') + '">' : '') + '</td></tr>\
                    <tr><td colspan="2"><strong>longitude</strong><br />' + (feature.properties['longitude'] !== null ? autolinker.link(String(feature.properties['longitude']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                    <tr><td colspan="2"><strong>latitude</strong><br />' + (feature.properties['latitude'] !== null ? autolinker.link(String(feature.properties['latitude']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) { addClassToPopupIfMedia(content, e.popup); });
			layer.bindPopup(content, { maxHeight: 400 });
        }
        function style_TPAMOJOKERTO_5_0() {
            return { pane: 'pane_TPAMOJOKERTO_5', radius: 6.0, opacity: 1, color: 'rgba(35,35,35,1.0)', weight: 1, fill: true, fillOpacity: 1, fillColor: 'rgba(207,155,102,1.0)', interactive: true };
        }
        map.createPane('pane_TPAMOJOKERTO_5');
        map.getPane('pane_TPAMOJOKERTO_5').style.zIndex = 405;
        var layer_TPAMOJOKERTO_5 = new L.geoJson(json_TPAMOJOKERTO_5, {
            interactive: true, pane: 'pane_TPAMOJOKERTO_5', onEachFeature: pop_TPAMOJOKERTO_5,
            pointToLayer: function (feature, latlng) { return L.circleMarker(latlng, style_TPAMOJOKERTO_5_0(feature)); },
        });
        bounds_group.addLayer(layer_TPAMOJOKERTO_5);
        map.addLayer(layer_TPAMOJOKERTO_5);

        // --- PENCARIAN PHOTON ---
        const url = {"Nominatim OSM": "https://nominatim.openstreetmap.org/search?format=geojson&addressdetails=1&"};
        var photonControl = L.control.photon({
            url: url["Nominatim OSM"], feedbackLabel: '', position: 'topleft', includePosition: true, initial: true,
        }).addTo(map);
        photonControl._container.childNodes[0].style.borderRadius="10px"
        var x = null; var marker = null; var z = null;
        photonControl.on('selected', function(e) {
            if (x != null) { map.removeLayer(obj3.marker); map.removeLayer(x); }
            obj2.gcd = e.choice;
            x = L.geoJSON(obj2.gcd).addTo(map);
            var label = typeof obj2.gcd.properties.label === 'undefined' ? obj2.gcd.properties.display_name : obj2.gcd.properties.label;
            obj3.marker = L.marker(x.getLayers()[0].getLatLng()).bindPopup(label).addTo(map);
            map.setView(x.getLayers()[0].getLatLng(), 17);
            z = typeof e.choice.properties.label === 'undefined'? e.choice.properties.display_name : e.choice.properties.label;
            e.target.input.value = z;
        });
        var search = document.getElementsByClassName("leaflet-photon leaflet-control")[0];
        search.classList.add("leaflet-control-search");
        search.style.display = "flex";
        search.style.backgroundColor="rgba(255,255,255,0.5)" 
        var button = document.createElement("div");
        button.id = "gcd-button-control"; button.className = "gcd-gl-btn fa fa-search search-button";
        search.insertBefore(button, search.firstChild);
        last = search.lastChild; last.style.display = "none";
        button.addEventListener("click", function (e) {
            if (last.style.display === "none") { last.style.display = "block"; } else { last.style.display = "none"; }
        });

        // --- KONTROL LAYER ---
        var overlaysTree = [
            {label: '<img src="legend/TPAMOJOKERTO_5.png" /> TPA MOJOKERTO', layer: layer_TPAMOJOKERTO_5},
            {label: 'Buffer TPA<br /><table><tr><td style="text-align: center;"><img src="legend/BufferTPA_4_5000m0.png" /></td><td>5000 m</td></tr><tr><td style="text-align: center;"><img src="legend/BufferTPA_4_10000m1.png" /></td><td>10,000 m</td></tr><tr><td style="text-align: center;"><img src="legend/BufferTPA_4_15000m2.png" /></td><td>15,000 m</td></tr></table>', layer: layer_BufferTPA_4},
            {label: "WEIGHTED OVL", layer: layer_WEIGHTEDOVL_3},
            {label: "Kemiringan Lereng", layer: layer_KemiringanLereng_2},
            {label: "Google Satelite", layer: layer_GoogleSatelite_1},
            {label: '<img src="legend/BatasKecamatanKabupatenMojokerto_0.png" /> Batas Kecamatan Kabupaten Mojokerto', layer: layer_BatasKecamatanKabupatenMojokerto_0},
        ];
        var lay = L.control.layers.tree(null, overlaysTree,{ collapsed: false });
        lay.addTo(map);
        
        // Pengaturan tinggi panel layer
		document.addEventListener("DOMContentLoaded", function() {
            function newLayersListHeight() {
                var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
                if (layerScrollbarElement) {
                    var layersListElement = document.querySelector('.leaflet-control-layers-list');
                    var originalHeight = layersListElement.style.height || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }
            }
            var isLayersListExpanded = true;
            var controlLayersElement = document.querySelector('.leaflet-control-layers');
            var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');
            toggleLayerControl.addEventListener('click', function() {
                if (isLayersListExpanded) { controlLayersElement.classList.remove('leaflet-control-layers-expanded'); } else { controlLayersElement.classList.add('leaflet-control-layers-expanded'); }
                isLayersListExpanded = !isLayersListExpanded; newLayersListHeight()
            });	
			if (controlLayersElement) {
				controlLayersElement.addEventListener('click', function(event) {
					var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
					if (toggleLayerHeaderPointer) { newLayersListHeight(); }
				});
			}
            setTimeout(function() { toggleLayerControl.click(); }, 10);
            setTimeout(function() { toggleLayerControl.click(); }, 10);
            var isSmallScreen = window.innerWidth < 650;
            if (isSmallScreen) {
                setTimeout(function() { controlLayersElement.classList.remove('leaflet-control-layers-expanded'); isLayersListExpanded = !isLayersListExpanded; }, 500);
            }  
        });       
        setBounds();
        L.ImageOverlay.include({ getBounds: function () { return this._bounds; } });

                </script>
